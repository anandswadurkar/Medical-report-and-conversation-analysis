# conda-forge only. `nodefaults` matters on this machine: mixing in the `defaults`
# channel makes conda's classic solver stall.
#
# Every pin is the version that was solved, installed and tested together on
# 2026-11-16 (116 tests passing). conda-lock-win-64.txt has the exact builds of all
# 100 packages and recreates the env with no solve at all, which is the fast route on
# a conda that only has the classic solver (see README "Install").
name: medexplain
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.18        # same interpreter as the sibling repos; requires-python is >=3.11
  - ipywidgets=8.1.9      # FileUpload.value is a tuple of dicts from 8.0; ui.py relies on that shape
  - ipykernel=6.29.5      # kernel for VS Code / Jupyter; matches the sibling envs
  - nbformat=5.11.1       # tools/build_notebook.py writes the notebook
  - nbclient=0.11.0       # tools/build_notebook.py --execute runs it headlessly
  - pypdf=7.1.0           # reads PDFs that have a text layer
  - python-docx=1.2.0     # reads .docx reports (pulls in lxml)
  - markdown=3.11.3       # renders Claude's Markdown answer as HTML
  - anthropic=2.8.0       # optional "Ask Claude" tab; its beta stream() was checked to accept every argument llm.py sends
  - pytest=9.2.0
  - hypothesis=6.170.15   # invariant tests (annotation round-trip, redaction idempotence)
  - ruff=0.17.5           # lint + format; same 0.17 series as the pre-commit hook
  - pip                   # only for `pip install -e . --no-deps`
